<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mun-Hwa Bu — Media Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Syne:wght@400;500;600;700&family=Syne+Mono&display=swap" rel="stylesheet">
<style>

:root {
 --black: #0f0f0f;
 --white: #ffffff;
 --cream: #f8f9fa;
 --gold: #2563a8;
 --gold-light: #e8f0fb;
 --red: #c0392b;
 --red-light: #fdecea;
 --green: #1a6b4a;
 --green-light: #e6f2ec;
 --blue: #2563a8;
 --blue-light: #e8f0fb;
 --muted: #6b7280;
 --border: #d0d0d0;
 --shadow: 0 2px 16px rgba(15,15,15,0.06);
 --shadow-lg: 0 8px 40px rgba(15,15,15,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
 font-family: 'Syne', sans-serif;
 background: var(--white);
 color: var(--black);
 min-height: 100vh;
 font-size: 15px;
 line-height: 1.6;
}

/* LANDING */
.landing {
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 2rem;
 background: var(--white);
 position: relative;
 overflow: hidden;
}

.landing::before {
 content: '';
 position: absolute;
 inset: 0;
 background: radial-gradient(ellipse at 30% 50%, rgba(200,65,10,0.06) 0%, transparent 60%),
 radial-gradient(ellipse at 70% 30%, rgba(26,107,74,0.04) 0%, transparent 50%);
 pointer-events: none;
}

.landing-inner {
 max-width: 640px;
 width: 100%;
 text-align: center;
 position: relative;
 z-index: 1;
 animation: fadeUp 0.6s ease;
}

.landing-logo {
 font-family: 'Playfair Display', serif;
 font-size: 0.75rem;
 letter-spacing: 0.25em;
 text-transform: uppercase;
 color: var(--blue);
 margin-bottom: 2.5rem;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 1rem;
}

.landing-logo::before, .landing-logo::after {
 content: '';
 width: 40px;
 height: 1px;
 background: var(--blue);
 opacity: 0.4;
}

.landing h1 {
 font-family: 'Playfair Display', serif;
 font-size: clamp(2.5rem, 6vw, 4rem);
 font-weight: 400;
 color: var(--black);
 line-height: 1.1;
 margin-bottom: 0.75rem;
 letter-spacing: -0.02em;
}

.landing h1 em {
 font-style: italic;
 color: var(--blue);
}

.landing p {
 color: var(--muted);
 font-size: 0.9rem;
 margin-bottom: 3rem;
 letter-spacing: 0.02em;
}

.role-cards {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 1rem;
}

.role-card {
 background: #ffffff;
 border: 1.5px solid var(--border);
 border-radius: 12px;
 padding: 2rem 1.5rem;
 cursor: pointer;
 transition: all 0.3s;
 text-align: left;
 position: relative;
 overflow: hidden;
}

.role-card::before {
 content: '';
 position: absolute;
 inset: 0;
 opacity: 0;
 transition: opacity 0.3s;
}

.role-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.role-card:hover::before { opacity: 1; }

.role-icon {
 font-size: 2rem;
 margin-bottom: 1rem;
 display: block;
}

.role-card h3 {
 font-size: 1rem;
 font-weight: 600;
 color: var(--black);
 margin-bottom: 0.4rem;
}

.role-card p {
 font-size: 0.78rem;
 color: #3a3530;
 margin-bottom: 1.25rem;
 line-height: 1.5;
}

.role-arrow {
 font-size: 0.75rem;
 color: var(--blue);
 font-family: 'Syne Mono', monospace;
 letter-spacing: 0.1em;
 text-transform: uppercase;
 font-weight: 600;
}

/* APP SHELL */
.app { display: none; min-height: 100vh; }
.app.active { display: block; }

header {
 background: var(--white);
 color: var(--black);
 padding: 0 2rem;
 display: flex;
 align-items: center;
 justify-content: space-between;
 height: 60px;
 position: sticky;
 top: 0;
 z-index: 100;
 border-bottom: 2px solid var(--border);
 box-shadow: 0 1px 8px rgba(37,99,168,0.07);
}

.header-logo {
 font-family: 'Playfair Display', serif;
 font-size: 1rem;
 letter-spacing: 0.02em;
}

.header-logo em { font-style: italic; color: var(--gold); }

.header-nav { display: flex; gap: 0.25rem; align-items: center; }

.nav-btn {
 background: none; border: 1px solid transparent; color: var(--muted);
 padding: 0.35rem 0.85rem; border-radius: 4px; cursor: pointer;
 font-family: 'Syne Mono', monospace; font-size: 0.65rem;
 letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.2s;
}
.nav-btn:hover { color: var(--blue); border-color: var(--border); }
.nav-btn.active { color: var(--white); background: var(--blue); border-color: var(--blue); }

.back-btn {
 display: flex; align-items: center; gap: 0.5rem;
 background: none; border: none; color: var(--muted);
 cursor: pointer; font-family: 'Syne', sans-serif;
 font-size: 0.8rem; transition: color 0.2s; padding: 0;
}
.back-btn:hover { color: var(--blue); }

/* PAGES */
.page { display: none; padding: 2.5rem 2rem; max-width: 720px; margin: 0 auto; }
.page.active { display: block; animation: fadeUp 0.3s ease; }
.page-wide { max-width: 1000px; }

@keyframes fadeUp {
 from { opacity: 0; transform: translateY(12px); }
 to { opacity: 1; transform: translateY(0); }
}

/* CULTURE TEAM HUB */
.hub-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 1rem;
 margin-top: 0.5rem;
}

.hub-card {
 background: #fff;
 border: 1px solid var(--border);
 border-radius: 12px;
 padding: 1.75rem;
 cursor: pointer;
 transition: all 0.25s;
 position: relative;
 overflow: hidden;
}

.hub-card::after {
 content: '→';
 position: absolute;
 bottom: 1.5rem;
 right: 1.5rem;
 font-size: 1.1rem;
 color: var(--border);
 transition: all 0.2s;
}

.hub-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.hub-card:hover::after { color: var(--gold); transform: translateX(3px); }

.hub-card h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 0.35rem; }
.hub-card p { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }

/* PAGE HEADERS */
.page-header { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
.page-header h1 { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 400; letter-spacing: -0.02em; }
.page-header p { color: var(--muted); margin-top: 0.35rem; font-size: 0.88rem; }

/* CARDS & FORM */
.card { background: #fff; border: 1.5px solid #222; border-radius: 10px; padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 1.25rem; }

.card-label {
 font-family: 'Syne Mono', monospace; font-size: 0.62rem;
 letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
 margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;
}
.card-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

.form-group { margin-bottom: 1.15rem; }
label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.4rem; color: var(--black); }
label .req { color: var(--red); margin-left: 2px; }
label .opt { color: var(--muted); font-weight: 400; font-size: 0.72rem; margin-left: 4px; }

input, select, textarea {
 width: 100%; padding: 0.65rem 0.9rem; border: 1px solid var(--border);
 border-radius: 7px; font-family: 'Syne', sans-serif; font-size: 0.88rem;
 background: #faf9f7; color: var(--black);
 transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
input:focus, select:focus, textarea:focus {
 border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,168,0.1); background: #fff;
}
textarea { resize: vertical; min-height: 90px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
.hint { font-size: 0.75rem; color: var(--muted); margin-top: 0.3rem; }

/* TOGGLE OPTIONS */
.toggle-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.toggle-opt {
 padding: 0.45rem 1rem; border-radius: 20px; border: 1.5px solid #bbb;
 background: #faf9f7; cursor: pointer; font-size: 0.82rem; font-family: 'Syne', sans-serif;
 transition: all 0.2s; color: var(--muted);
}
.toggle-opt:hover { border-color: var(--gold); color: var(--black); }
.toggle-opt.selected { background: var(--blue-light); border-color: var(--blue); color: var(--blue); font-weight: 600; }
.toggle-opt.selected-red { background: var(--red-light); border-color: var(--red); color: var(--red); font-weight: 600; }

/* YES/NO TOGGLES */
.yn-group { display: flex; gap: 0.5rem; }
.yn-btn {
 flex: 1; padding: 0.6rem; border-radius: 7px; border: 1.5px solid #bbb;
 background: #faf9f7; cursor: pointer; font-size: 0.85rem; font-family: 'Syne', sans-serif;
 transition: all 0.2s; text-align: center; color: var(--muted);
}
.yn-btn.yes.active { background: var(--green-light); border-color: var(--green); color: var(--green); font-weight: 600; }
.yn-btn.no.active { background: var(--red-light); border-color: var(--red); color: var(--red); font-weight: 600; }

/* STEPS */
.steps {
 display: flex; margin-bottom: 2rem; border: 1.5px solid #222;
 border-radius: 8px; overflow: hidden; background: #fff;
}
.step {
 flex: 1; padding: 0.7rem 0.5rem; text-align: center; font-size: 0.72rem;
 color: var(--muted); border-right: 1px solid #d0d0d0; transition: all 0.2s;
}
.step:last-child { border-right: none; }
.step.active { background: var(--blue); color: #fff; font-weight: 600; }
.step.done { background: var(--blue-light); color: var(--blue); }
.step-num { font-family: 'Syne Mono', monospace; font-size: 0.58rem; display: block; opacity: 0.6; margin-bottom: 0.1rem; }

.form-step { display: none; }
.form-step.active { display: block; animation: fadeUp 0.25s ease; }

/* BUTTONS */
.btn {
 display: inline-flex; align-items: center; gap: 0.5rem;
 padding: 0.7rem 1.5rem; border-radius: 7px; border: none; cursor: pointer;
 font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 600;
 transition: all 0.2s; letter-spacing: 0.01em;
}
.btn-gold { background: var(--blue); color: #fff; }
.btn-gold:hover { background: #1a4f8a; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,168,0.3); }
.btn-dark { background: var(--black); color: var(--white); }
.btn-dark:hover { background: #1a1a1a; }
.btn-ghost { background: transparent; color: var(--black); border: 1.5px solid var(--border); }
.btn-ghost:hover { background: var(--cream); border-color: #bbb; }
.btn-red { background: var(--red); color: #fff; }
.btn-red:hover { background: #9a2020; }
.btn-green { background: var(--green); color: #fff; }
.btn-green:hover { background: #154d2e; }
.btn-sm { padding: 0.4rem 0.9rem; font-size: 0.78rem; }
.btn-full { width: 100%; justify-content: center; }

/* BADGES */
.badge {
 display: inline-flex; align-items: center; padding: 0.2rem 0.65rem;
 border-radius: 20px; font-size: 0.68rem; font-weight: 600;
 font-family: 'Syne Mono', monospace; letter-spacing: 0.04em;
}
.badge-available { background: var(--green-light); color: var(--green); }
.badge-out { background: var(--red-light); color: var(--red); }
.badge-pending { background: #fef5e0; color: #9a6f00; }
.badge-overdue { background: var(--red-light); color: var(--red); border: 1px solid var(--red); }
.badge-internal { background: var(--blue-light); color: var(--blue); }
.badge-external { background: var(--gold-light); color: #7a5a00; }

/* NOTICE */
.notice {
 border-radius: 8px; padding: 0.85rem 1rem; font-size: 0.82rem;
 margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.6rem; line-height: 1.5;
}
.notice-gold { background: var(--blue-light); border: 1px solid rgba(37,99,168,0.3); color: var(--blue); }
.notice-blue { background: var(--blue-light); border: 1px solid rgba(26,58,92,0.2); color: var(--blue); }
.notice-red { background: var(--red-light); border: 1px solid rgba(184,50,50,0.2); color: var(--red); }

/* REVIEW */
.review-row {
 display: flex; justify-content: space-between; align-items: baseline;
 padding: 0.6rem 0; border-bottom: 1px solid var(--border); font-size: 0.88rem;
}
.review-row:last-child { border-bottom: none; }
.review-key { color: var(--muted); font-size: 0.75rem; min-width: 140px; }
.review-val { font-weight: 500; text-align: right; }

.section-label {
 font-family: 'Syne Mono', monospace; font-size: 0.62rem; letter-spacing: 0.14em;
 text-transform: uppercase; color: var(--muted); margin: 1.5rem 0 0.75rem;
}

/* SUCCESS */
.success-state { text-align: center; padding: 3rem 2rem; }
.success-icon {
 width: 72px; height: 72px; border-radius: 50%;
 background: var(--green-light); color: var(--green);
 display: flex; align-items: center; justify-content: center;
 font-size: 2rem; margin: 0 auto 1.5rem;
}
.success-state h2 { font-family: 'Playfair Display', serif; font-size: 1.9rem; font-weight: 400; margin-bottom: 0.5rem; }
.success-state p { color: var(--muted); max-width: 380px; margin: 0 auto 2rem; font-size: 0.88rem; }

/* ITEM PICKER (for checkout & damage) */
.item-search { margin-bottom: 1rem; }
.item-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.item-row {
 display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1rem;
 border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
}
.item-row:last-child { border-bottom: none; }
.item-row:hover { background: var(--cream); }
.item-row.selected { background: var(--gold-light); }
.item-row.unavailable { opacity: 0.4; cursor: not-allowed; }
.item-check {
 width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid var(--border);
 flex-shrink: 0; display: flex; align-items: center; justify-content: center;
 font-size: 0.65rem; color: transparent; transition: all 0.15s;
}
.item-row.selected .item-check { background: var(--gold); border-color: var(--gold); color: var(--black); }
.item-name { font-size: 0.85rem; font-weight: 500; flex: 1; }
.item-sub { font-size: 0.72rem; color: var(--muted); font-family: 'Syne Mono', monospace; }
.item-status { flex-shrink: 0; }

/* ADMIN TABLE */
.data-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.data-table th {
 text-align: left; padding: 0.65rem 1rem;
 font-family: 'Syne Mono', monospace; font-size: 0.62rem;
 letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
 border-bottom: 2px solid var(--border); background: #faf9f7;
}
.data-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:hover td { background: #fafaf7; }
.data-table tr:last-child td { border-bottom: none; }
.chip { display: inline-block; background: var(--cream); border-radius: 3px; padding: 0.1rem 0.4rem; margin: 0.1rem; font-family: 'Syne Mono', monospace; font-size: 0.68rem; color: var(--muted); }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; text-align: center; }
.stat-num { font-family: 'Playfair Display', serif; font-size: 2.4rem; line-height: 1; }
.stat-lbl { font-family: 'Syne Mono', monospace; font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 0.3rem; }
.stat-card.s-gold .stat-num { color: var(--gold); }
.stat-card.s-red .stat-num { color: var(--red); }
.stat-card.s-green .stat-num { color: var(--green); }

/* GROUPED EVENT LIST */

.location-header h4 { font-size: 0.88rem; font-weight: 600; letter-spacing: 0.02em; }
.location-header .loc-count { font-family: 'Syne Mono', monospace; font-size: 0.7rem; color: #a09a93; }
.location-header .loc-chevron { font-size: 0.75rem; transition: transform 0.2s; color: var(--gold); }
.location-header.open .loc-chevron { transform: rotate(180deg); }

.location-body.open { display: block; }

.cat-group-header span { font-family: 'Syne Mono', monospace; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.cat-group-header .cat-count { font-size: 0.68rem; color: var(--muted); }

.cat-group-items.open { display: block; }
.el-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 0.75rem; }
.el-toolbar input { flex: 1; }

/* KEYWORD BADGE */
.keyword-hint { font-size: 0.7rem; color: var(--gold); font-family: 'Syne Mono', monospace; margin-top: 0.15rem; }

/* REQUEST TYPE CARDS */
.req-type-card, .assist-card {
 display: flex; align-items: flex-start; gap: 0.85rem;
 border: 1.5px solid #222; border-radius: 8px; padding: 1rem 1.1rem;
 cursor: pointer; transition: all 0.2s; background: #fff;
}
.req-type-card:hover, .assist-card:hover { border-color: var(--blue); }
.req-type-card.selected, .assist-card.selected { border-color: var(--blue); background: var(--blue-light); }
.req-type-check {
 width: 22px; height: 22px; border-radius: 5px; border: 2px solid #bbb;
 background: #fff; display: flex; align-items: center; justify-content: center;
 font-size: 0.7rem; color: transparent; transition: all 0.2s; flex-shrink: 0; margin-top: 2px;
}
.req-type-card.selected .req-type-check, .assist-card.selected .req-type-check {
 background: var(--blue); border-color: var(--blue); color: #fff;
}
.req-type-label { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.2rem; }
.req-type-desc { font-size: 0.78rem; color: var(--muted); line-height: 1.4; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,10,10,0.7); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 14px; padding: 2rem; max-width: 480px; width: 100%; box-shadow: var(--shadow-lg); animation: fadeUp 0.2s ease; }
.modal h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 0.5rem; }
.modal p { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
.modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }

/* ADMIN LOGIN */

@media (max-width: 768px) {
  /* ── Layout ── */
  header { padding: 0 1rem; height: auto; min-height: 56px; flex-wrap: wrap; gap: 0.5rem; padding-top: 0.5rem; padding-bottom: 0.5rem; }
  .header-logo { font-size: 0.95rem; }
  .header-nav { gap: 0.15rem; flex-wrap: wrap; }
  .nav-btn { padding: 0.3rem 0.6rem; font-size: 0.6rem; }
  .back-btn { font-size: 0.75rem; }

  /* ── Pages ── */
  .page { padding: 1.25rem 1rem; }
  .page-wide { max-width: 100%; }

  /* ── Grids → single column ── */
  .form-row, .form-row-3, .hub-grid, .role-cards, .stats-row { grid-template-columns: 1fr; }

  /* ── Landing ── */
  .landing { padding: 2rem 1.25rem; }
  .landing h1 { font-size: 2.2rem; }
  .landing-inner { max-width: 100%; }
  .role-card { padding: 1.25rem; }
  .role-card p { font-size: 0.82rem; }

  /* ── Steps bar ── */
  .steps { overflow-x: auto; }
  .step { min-width: 60px; font-size: 0.65rem; padding: 0.6rem 0.25rem; }
  .step-num { font-size: 0.55rem; }

  /* ── Cards ── */
  .card { padding: 1.1rem; }
  .card-label { font-size: 0.6rem; }

  /* ── Forms ── */
  input, select, textarea { font-size: 0.88rem; padding: 0.6rem 0.75rem; }
  label { font-size: 0.8rem; }
  textarea { min-height: 75px; }

  /* ── Buttons ── */
  .btn { padding: 0.75rem 1.1rem; font-size: 0.85rem; }
  .btn-sm { padding: 0.55rem 0.85rem; font-size: 0.78rem; }
  .btn-full { width: 100%; }

  /* ── Toggle options ── */
  .toggle-group { gap: 0.4rem; }
  .toggle-opt { padding: 0.45rem 0.75rem; font-size: 0.78rem; }

  /* ── Request type cards ── */
  .req-type-card, .assist-card { padding: 0.85rem; gap: 0.65rem; }
  .req-type-label { font-size: 0.85rem; }
  .req-type-desc { font-size: 0.73rem; }
  .req-type-check { width: 20px; height: 20px; flex-shrink: 0; }

  /* ── Hub cards ── */
  .hub-card { padding: 1.1rem; }
  .hub-card h3 { font-size: 0.88rem; }
  .hub-card p { font-size: 0.76rem; }

  /* ── Page headers ── */
  .page-header h1 { font-size: 1.5rem; }
  .page-header p { font-size: 0.82rem; }

  /* ── Admin ── */
  .stats-row { grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .stat-num { font-size: 1.75rem; }
  .data-table { font-size: 0.75rem; }
  .data-table th, .data-table td { padding: 0.6rem 0.65rem; }

  /* ── YN buttons ── */
  .yn-btn { font-size: 0.82rem; padding: 0.65rem; }

  /* ── Modal ── */
  .modal { padding: 1.5rem; }
  .modal h3 { font-size: 1.2rem; }

  /* ── Props tabs ── */

<body>

<header style="background:#fff;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;border-bottom:1.5px solid #222;">
  <div class="header-logo">Mun-Hwa Bu <span style="font-size:0.65rem;color:var(--muted);font-family:'Syne Mono',monospace;letter-spacing:0.1em;margin-left:0.5rem;">MEDIA DESK</span></div>
  <a href="index.html" class="btn btn-ghost btn-sm" style="text-decoration:none;">Back</a>
</header>

<div style="max-width:560px;margin:0 auto;padding:2rem 1rem;">

  <!-- TABS -->
  <div style="display:flex;border:1.5px solid #222;border-radius:8px;overflow:hidden;margin-bottom:1.5rem;">
    <div id="md-tab-in" onclick="mdShowTab('in')" style="flex:1;padding:0.65rem;text-align:center;font-size:0.8rem;font-weight:600;cursor:pointer;background:#222;color:#fff;border-right:1px solid #222;">Sign In</div>
    <div id="md-tab-out" onclick="mdShowTab('out')" style="flex:1;padding:0.65rem;text-align:center;font-size:0.8rem;font-weight:600;cursor:pointer;background:#fff;color:var(--muted);">Sign Out</div>
  </div>

  <!-- SIGN IN -->
  <div id="md-signin-panel">
    <div class="card">
      <div class="card-label">Sign In</div>

      <div class="form-group">
        <label>Name <span class="req">*</span></label>
        <input type="text" id="md-name" placeholder="Your name">
      </div>

      <div class="form-group">
        <label>What are you operating? <span class="req">*</span></label>
        <div style="display:flex;flex-direction:column;gap:0.5rem;margin-top:0.25rem;">
          <label style="display:flex;align-items:center;gap:0.6rem;font-weight:400;font-size:0.88rem;cursor:pointer;"><input type="checkbox" id="md-eq-mixer" value="Mixer" style="width:16px;height:16px;accent-color:#2563a8;"> Mixer</label>
          <label style="display:flex;align-items:center;gap:0.6rem;font-weight:400;font-size:0.88rem;cursor:pointer;"><input type="checkbox" id="md-eq-cam" value="Camera controller" style="width:16px;height:16px;accent-color:#2563a8;"> Camera controller</label>
          <label style="display:flex;align-items:center;gap:0.6rem;font-weight:400;font-size:0.88rem;cursor:pointer;"><input type="checkbox" id="md-eq-atem" value="ATEM" style="width:16px;height:16px;accent-color:#2563a8;"> ATEM</label>
          <label style="display:flex;align-items:center;gap:0.6rem;font-weight:400;font-size:0.88rem;cursor:pointer;"><input type="checkbox" id="md-eq-pc" value="PC" style="width:16px;height:16px;accent-color:#2563a8;"> PC</label>
        </div>
      </div>

      <div class="form-group">
        <label>Purpose / Event <span class="req">*</span></label>
        <input type="text" id="md-purpose" placeholder="e.g. Sunday Service, Youth Meeting">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date <span class="req">*</span></label>
          <input type="date" id="md-date">
        </div>
        <div class="form-group">
          <label>Time In <span class="req">*</span></label>
          <input type="time" id="md-time-in">
        </div>
      </div>

      <div class="form-group">
        <label>Is anyone assisting you?</label>
        <div style="display:flex;gap:1.5rem;margin-top:0.25rem;">
          <label style="display:flex;align-items:center;gap:0.4rem;font-weight:400;font-size:0.88rem;cursor:pointer;"><input type="radio" name="md-has-assistant" value="yes" onchange="mdToggleAssistants(true)" style="accent-color:#2563a8;"> Yes</label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-weight:400;font-size:0.88rem;cursor:pointer;"><input type="radio" name="md-has-assistant" value="no" onchange="mdToggleAssistants(false)" checked style="accent-color:#2563a8;"> No</label>
        </div>
      </div>

      <div id="md-assistants-block" style="display:none;">
        <div id="md-assistants-list" style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:0.5rem;"></div>
        <button type="button" class="btn btn-ghost btn-sm" onclick="mdAddAssistant()">+ Add another</button>
      </div>
    </div>

    <button class="btn btn-dark btn-full" id="md-signin-btn" onclick="mdSubmitSignIn()">Sign In</button>
  </div>

  <!-- SIGN OUT -->
  <div id="md-signout-panel" style="display:none;">
    <div class="card">
      <div class="card-label">Sign Out</div>
      <div class="form-group">
        <label>Select your entry <span class="req">*</span></label>
        <select id="md-entry-select" style="width:100%;"></select>
        <div class="hint">Today's open entries. Select the one you are signing out of.</div>
      </div>
      <div class="form-group">
        <label>Your name <span class="req">*</span></label>
        <input type="text" id="md-signout-name" placeholder="Your name">
      </div>
      <div class="form-group">
        <label>Time Out <span class="req">*</span></label>
        <input type="time" id="md-time-out">
      </div>
      <div class="form-group">
        <label>Any issues or damaged items to report? <span class="opt">(optional)</span></label>
        <div style="display:flex;gap:1.5rem;margin-top:0.25rem;margin-bottom:0.75rem;">
          <label style="display:flex;align-items:center;gap:0.4rem;font-weight:400;font-size:0.88rem;cursor:pointer;"><input type="radio" name="md-has-issue" value="yes" onchange="mdToggleIssue(true)" style="accent-color:#2563a8;"> Yes</label>
          <label style="display:flex;align-items:center;gap:0.4rem;font-weight:400;font-size:0.88rem;cursor:pointer;"><input type="radio" name="md-has-issue" value="no" onchange="mdToggleIssue(false)" checked style="accent-color:#2563a8;"> No</label>
        </div>
        <div id="md-issue-block" style="display:none;">
          <textarea id="md-issue-details" placeholder="Describe the issue or damaged item in detail..." style="min-height:80px;width:100%;padding:0.6rem 0.75rem;font-size:0.85rem;border:1.5px solid #bbb;border-radius:7px;font-family:'Syne',sans-serif;resize:vertical;"></textarea>
        </div>
      </div>
    </div>
    <button class="btn btn-dark btn-full" id="md-signout-btn" onclick="mdSubmitSignOut()">Sign Out</button>
  </div>

  <!-- SUCCESS -->
  <div id="md-success" style="display:none;">
    <div class="success-state">
      <div class="success-icon"></div>
      <h2 id="md-success-title"></h2>
      <p id="md-success-msg"></p>
      <button class="btn btn-dark" onclick="mdReset()">Done</button>
    </div>
  </div>

</div>

<script>
const CONFIG = {
 APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwA86mqargcUKG4wtxPFtFRH8th8aDalxHAnzyo5gVryxK5umZvnGzJviLhtMJZ6D_p0g/exec',
 SHEET_ID: '1FWY-jAJVXtl13SwZ590VwyKq5cV6jnv6fTSoRfVZW-w',
 ADMIN_PASSWORD: 'mediaadmin2024',
};

function formatDate(dateStr) {
 if (!dateStr) return '—';
 try {
 const parts = String(dateStr).split('T')[0].split('-');
 const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
 return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
 } catch(e) { return dateStr; }
}

async function postToScript(payload) {
  try {
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify(payload),
    });
    return await res.json();
  } catch (err) {
    console.error('postToScript error:', err);
    return { error: err.toString() };
  }
}

// MEDIA DESK (/#mediadesk)
// ══════════════════════════════════════════════════════════════════════════════

const MD_EQUIPMENT = ['Mixer', 'Camera controller', 'ATEM', 'PC'];
let mdAssistantCount = 0;

function mdInit() {
  // Default time in to now
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('md-time-in').value = hh + ':' + mm;
  document.getElementById('md-time-out').value = hh + ':' + mm;
  document.getElementById('md-date').value = new Date().toISOString().split('T')[0];
  mdShowTab('in');
}

function mdShowTab(tab) {
  const isIn = tab === 'in';
  document.getElementById('md-signin-panel').style.display = isIn ? 'block' : 'none';
  document.getElementById('md-signout-panel').style.display = isIn ? 'none' : 'block';
  document.getElementById('md-success').style.display = 'none';
  document.getElementById('md-tab-in').style.background = isIn ? '#222' : '#fff';
  document.getElementById('md-tab-in').style.color = isIn ? '#fff' : 'var(--muted)';
  document.getElementById('md-tab-out').style.background = isIn ? '#fff' : '#222';
  document.getElementById('md-tab-out').style.color = isIn ? 'var(--muted)' : '#fff';
  if (!isIn) mdLoadOpenEntries();
}

function mdToggleIssue(show) {
  document.getElementById('md-issue-block').style.display = show ? 'block' : 'none';
}

function mdToggleAssistants(show) {
  const block = document.getElementById('md-assistants-block');
  block.style.display = show ? 'block' : 'none';
  if (show && mdAssistantCount === 0) mdAddAssistant();
}

function mdAddAssistant() {
  mdAssistantCount++;
  const id = 'md-asst-' + mdAssistantCount;
  const list = document.getElementById('md-assistants-list');
  const row = document.createElement('div');
  row.id = id;
  row.style.cssText = 'display:flex;gap:0.5rem;align-items:center;margin-bottom:0.5rem;';
  row.innerHTML = '<input type="text" placeholder="Assistant name" style="flex:1;padding:0.55rem 0.75rem;font-size:0.85rem;border:1.5px solid #bbb;border-radius:7px;">' +
    '<select style="flex:1;padding:0.55rem 0.75rem;font-size:0.85rem;border:1.5px solid #bbb;border-radius:7px;">' +
    MD_EQUIPMENT.map(function(e) { return '<option>' + e + '</option>'; }).join('') +
    '</select>' +
    '<button onclick="this.parentElement.remove()" style="background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--muted);padding:0 4px;">×</button>';
  list.appendChild(row);
}

async function mdSubmitSignIn() {
  const name = document.getElementById('md-name').value.trim();
  if (!name) { alert('Please enter your name.'); return; }

  const equipment = MD_EQUIPMENT.filter(function(e) {
    return document.querySelector('input[value="' + e + '"]').checked;
  });
  if (equipment.length === 0) { alert('Please select at least one piece of equipment.'); return; }

  const purpose = document.getElementById('md-purpose').value.trim();
  if (!purpose) { alert('Please enter a purpose or event name.'); return; }
  const date = document.getElementById('md-date').value;
  if (!date) { alert('Please select a date.'); return; }
  const timeIn = document.getElementById('md-time-in').value;
  if (!timeIn) { alert('Please enter a time in.'); return; }

  const hasAssistant = document.querySelector('input[name="md-has-assistant"]:checked').value === 'yes';
  const assistants = [];
  if (hasAssistant) {
    document.querySelectorAll('#md-assistants-list > div').forEach(function(row) {
      const aName = row.querySelector('input[type="text"]').value.trim();
      const aEquip = row.querySelector('select').value;
      if (aName) assistants.push({ name: aName, equipment: aEquip });
    });
  }

  const btn = document.querySelector('#md-signin-panel .btn-dark');
  if (btn) { btn.textContent = 'Signing in...'; btn.disabled = true; }

  try {
    const res = await postToScript({
      action: 'mdSignIn',
      name: name,
      equipment: equipment,
      purpose: purpose,
      timeIn: timeIn,
      assistants: assistants,
      date: date
    });

    document.getElementById('md-signin-panel').style.display = 'none';
    document.getElementById('md-success').style.display = 'block';
    document.getElementById('md-success-title').textContent = 'Signed In';
    document.getElementById('md-success-msg').textContent = name + ' signed in at ' + timeIn + ' on ' + equipment.join(', ') + '.';
  } catch(e) {
    alert('Something went wrong. Please try again.');
  } finally {
    if (btn) { btn.textContent = 'Sign In'; btn.disabled = false; }
  }
}

async function mdLoadOpenEntries() {
  const sel = document.getElementById('md-entry-select');
  sel.innerHTML = '<option value="">Loading...</option>';
  try {
    const res = await postToScript({ action: 'mdGetOpenEntries', date: new Date().toISOString().split('T')[0] });
    if (res.entries && res.entries.length > 0) {
      sel.innerHTML = '<option value="">— Select your entry —</option>' +
        res.entries.map(function(e) {
          const assistantStr = e.assistants && e.assistants.length ? ' (+ ' + e.assistants.map(function(a){ return a.name; }).join(', ') + ')' : '';
          return '<option value="' + e.id + '">' + e.name + ' — ' + e.equipment.join(', ') + assistantStr + '</option>';
        }).join('');
    } else {
      sel.innerHTML = '<option value="">No open entries for today</option>';
    }
  } catch(e) {
    sel.innerHTML = '<option value="">Error loading entries</option>';
  }
}

async function mdSubmitSignOut() {
  const entryId = document.getElementById('md-entry-select').value;
  if (!entryId) { alert('Please select an entry.'); return; }

  const signOutName = document.getElementById('md-signout-name').value.trim();
  if (!signOutName) { alert('Please enter your name.'); return; }

  const timeOut = document.getElementById('md-time-out').value;
  if (!timeOut) { alert('Please enter a time out.'); return; }

  const btn = document.querySelector('#md-signout-panel .btn-dark');
  if (btn) { btn.textContent = 'Signing out...'; btn.disabled = true; }

  try {
    await postToScript({
      action: 'mdSignOut',
      entryId: entryId,
      signOutName: signOutName,
      timeOut: timeOut
    });

    document.getElementById('md-signout-panel').style.display = 'none';
    document.getElementById('md-success').style.display = 'block';
    document.getElementById('md-success-title').textContent = 'Signed Out';
    const issueNote = issueDetails ? ' Issue reported.' : '';
    document.getElementById('md-success-msg').textContent = signOutName + ' signed out at ' + timeOut + '.' + issueNote;
  } catch(e) {
    alert('Something went wrong. Please try again.');
  } finally {
    if (btn) { btn.textContent = 'Sign Out'; btn.disabled = false; }
  }
}

function mdReset() {
  // Reset sign in form
  document.getElementById('md-name').value = '';
  MD_EQUIPMENT.forEach(function(e) {
    const el = document.querySelector('input[value="' + e + '"]');
    if (el) el.checked = false;
  });
  document.querySelector('input[name="md-has-assistant"][value="no"]').checked = true;
  document.getElementById('md-assistants-block').style.display = 'none';
  document.getElementById('md-assistants-list').innerHTML = '';
  mdAssistantCount = 0;
  document.getElementById('md-signout-name').value = '';
  document.getElementById('md-purpose').value = '';
  document.getElementById('md-date').value = new Date().toISOString().split('T')[0];
  document.querySelector('input[name="md-has-issue"][value="no"]').checked = true;
  document.getElementById('md-issue-block').style.display = 'none';
  document.getElementById('md-issue-details').value = '';
  document.getElementById('md-success').style.display = 'none';

  // Re-init time
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('md-time-in').value = hh + ':' + mm;
  document.getElementById('md-time-out').value = hh + ':' + mm;

  mdShowTab('in');
}




document.addEventListener('DOMContentLoaded', function() {
  mdInit();
});
</script>
